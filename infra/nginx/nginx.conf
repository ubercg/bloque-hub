events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Prefer explicit container DNS names on the shared Docker network
    # (short names like `backend` can be ambiguous when other stacks join).
    upstream hub_backend {
        server bloque-hub-backend:8000;
    }

    upstream hub_frontend {
        server bloque-hub-frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 25M;

        # Shared edge nginx (Sigao) proxies /bloque/* here.
        # Frontend is built with NEXT_PUBLIC_API_URL=/bloque/api.
        location ^~ /bloque/api/ {
            proxy_pass http://hub_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /bloque/api {
            return 302 /bloque/api/;
        }

        location ^~ /api/ {
            proxy_pass http://hub_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location = /api {
            return 302 /api/;
        }

        location = /health {
            proxy_pass http://hub_backend/api/v1/system/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /api/docs {
            proxy_pass http://hub_backend/api/v1/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://hub_backend/api/v1/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://hub_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
