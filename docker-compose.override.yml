services:
  backend:
    # Dev: recarga al cambiar código montado en ./src/backend/app (evita 500 por ORM viejo en memoria).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # REQ-013: PORTAL_API_BASE_URL / PORTAL_HUB_API_KEY / PORTAL_HUB_API_SECRET
    # vienen de `.env` (gitignored). No hardcodear credenciales reales aquí —
    # este archivo está trackeado por git.
    # Para volver al double local: en `.env` poné
    #   PORTAL_API_BASE_URL=http://portal-mock:9000
    #   PORTAL_HUB_API_KEY=dev-local-portal-hub-key
    #   PORTAL_HUB_API_SECRET=dev-local-portal-hub-secret
    environment:
      DEFAULT_TENANT_ID: "9fe8fa0f-dfbb-46ab-8786-893a29115b88"
    volumes:
      # REQ-013: monta el double para que src/backend/tests/test_portal_mock.py
      # pueda cargarlo vía importlib.util.spec_from_file_location dentro del contenedor.
      - ./portal-mock.py:/app/portal-mock.py:ro

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../infra/docker/Dockerfile.frontend
      target: deps
      no_cache: false
    # next dev requiere NODE_ENV=development; con production + volumen .next viejo aparecen 500
    # (react-dom/cjs faltante, required-server-files.json ENOENT). .next en el bind mount (gitignored), no volumen nombrado.
    # Si ves 500 y "Can't resolve react-dom": borra el volumen frontend_node_modules y levantá de nuevo,
    # o una vez: docker compose run --rm frontend sh -c "npm ci --include=dev"
    command: sh -c "npm install --include=dev && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/bloque/login', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules

  nginx:
    # Publish the reverse proxy to the host so local tooling (E2E from host, browser)
    # can reach the app at http://localhost/bloque (base compose leaves ports unset).
    ports:
      - "80:80"

  # REQ-013 RN-019: double HMAC-verificador y PERMANENTE del contrato real de
  # bloque_portal (no descartable — a diferencia del mock de contrato asumido
  # de REQ-012 que este reemplaza). Requerido para que `docker compose up`
  # responda la ruta real de integración en desarrollo local.
  portal-mock:
    image: python:3.12-slim
    container_name: bloque-hub-portal-mock
    command: python /portal-mock.py
    environment:
      # REQ-013 RN-020: par local-double ÚNICAMENTE. Nunca reutilizar el par
      # real de Portal aquí (ese vive en `.env` del backend).
      PORTAL_HUB_API_KEY: "dev-local-portal-hub-key"
      PORTAL_HUB_API_SECRET: "dev-local-portal-hub-secret"
    volumes:
      - ./portal-mock.py:/portal-mock.py:ro
    networks:
      - app-network

volumes:
  frontend_node_modules:
